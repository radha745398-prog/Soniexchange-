<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoniExchange - Client Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 400; /* Normal text weight */
        }

        body {
            /* Admin Panel Slate/Dark-Blue Match */
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        /* Top Brand Logo */
        .brand-header {
            margin-top: 45px;
            text-align: center;
        }

        .brand-logo {
            font-size: 38px;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Center White Card */
        .login-card {
            background: #ffffff;
            width: 88%;
            max-width: 360px;
            border-radius: 6px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            margin: 20px 0;
        }

        .card-title {
            color: #1e293b;
            font-size: 20px;
            text-align: center;
            margin-bottom: 18px;
        }

        /* Form Inputs */
        .input-group {
            display: flex;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
            background: #ffffff;
        }

        .input-group input {
            flex: 1;
            padding: 10px 12px;
            border: none;
            outline: none;
            font-size: 14px;
            color: #334155;
        }

        .input-group .icon-box {
            width: 40px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 14px;
            border-left: 1px solid #e2e8f0;
        }

        /* Admin Theme Buttons */
        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s ease;
        }

        .btn-primary {
            background: #0f172a; /* Admin Dark Tone */
            color: #ffffff;
            margin-top: 14px;
            margin-bottom: 8px;
        }

        .btn-primary:active {
            background: #1e293b;
        }

        .btn-secondary {
            background: #334155;
            color: #ffffff;
        }

        .btn-secondary:active {
            background: #475569;
        }

        /* Admin Switch Alert Banner */
        .admin-banner {
            display: none;
            background: #38bdf8;
            color: #0f172a;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
            text-align: center;
        }

        /* Bottom Footer */
        .footer {
            width: 100%;
            background: #090d16;
            padding: 14px 10px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
        }

        .support-text {
            font-size: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Header Logo -->
    <div class="brand-header">
        <div class="brand-logo">SONIEXCHANGE</div>
    </div>

    <!-- Main Card -->
    <div class="login-card">
        <div class="card-title">Login 👎</div>

        <div id="adminNotice" class="admin-banner">
            <i class="fa-solid fa-shield-halved"></i> Admin Switch Mode Active
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
                <div class="icon-box"><i class="fa-solid fa-user"></i></div>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <div class="icon-box"><i class="fa-solid fa-key"></i></div>
            </div>

            <button type="submit" class="btn btn-primary">
                Login <i class="fa-solid fa-right-to-bracket"></i>
            </button>
            
            <button type="button" class="btn btn-secondary" onclick="demoLogin()">
                Login with demo ID <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-links">
            <a href="#">Terms and Conditions</a>
            <a href="#">Responsible Gaming</a>
        </div>
        <div class="support-text">24X7 Support</div>
    </div>

    <script>
        // Admin Panel Impersonate/Switch Handler
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('impersonate_token');
            const client = urlParams.get('client_id');

            if (token && client) {
                document.getElementById('adminNotice').style.display = 'block';
                document.getElementById('username').value = client;
                document.getElementById('password').value = "********";
            }
        };

        function handleLogin() {
            alert("Client Login Triggered!");
        }

        function demoLogin() {
            document.getElementById('username').value = "demo_client";
            document.getElementById('password').value = "demo123";
            handleLogin();
        }
    </script>
</body>
</html>
